{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-xl border border-slate-200 p-8 shadow-sm space-y-6">
  <h1 class="text-2xl font-bold">Customer Profile</h1>

  <div class="space-y-3 border-b border-slate-100 pb-4">
    <div class="flex justify-between py-1 text-sm">
      <span class="text-slate-500">Name:</span>
      <span class="font-bold">{{ profile.name }}</span>
    </div>
    <div class="flex justify-between py-1 text-sm">
      <span class="text-slate-500">Email:</span>
      <span class="font-medium text-slate-700">{{ profile.email }}</span>
    </div>
  </div>

  <form action="/profile" method="POST" class="space-y-4">
    <label class="block text-sm font-semibold text-slate-700">Notification Channel Preference</label>
    <select name="channel" class="w-full border border-slate-300 rounded-md p-2 text-sm focus:ring-1 focus:ring-indigo-500">
      <option value="email" {% if profile.channel == 'email' %}selected{% endif %}>Email</option>
      <option value="sms" {% if profile.channel == 'sms' %}selected{% endif %}>SMS</option>
      <option value="push" {% if profile.channel == 'push' %}selected{% endif %}>Push Notification</option>
    </select>
    <button type="submit" class="w-full bg-slate-800 text-white py-2 rounded-md font-semibold text-sm hover:bg-slate-900">
      Save preferences
    </button>
  </form>
</div>
{% endblock %}
