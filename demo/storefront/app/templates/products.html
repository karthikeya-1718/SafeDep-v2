{% extends "base.html" %}
{% block content %}
<div class="space-y-6">
  <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
    <h1 class="text-2xl font-bold">All Products</h1>
    <form action="/products" method="GET" class="flex w-full sm:w-auto">
      <input type="text" name="q" value="{{ query }}" placeholder="Search products..." class="border border-slate-300 rounded-l-md px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500 w-full sm:w-64">
      <button type="submit" class="bg-indigo-600 text-white px-4 py-1.5 rounded-r-md text-sm font-semibold hover:bg-indigo-700">Search</button>
    </form>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
    {% for product in products %}
    <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
      <div class="text-5xl text-center py-4 bg-slate-100 rounded-lg">{{ product.emoji }}</div>
      <h3 class="font-bold text-lg mt-3">{{ product.name }}</h3>
      <p class="text-indigo-600 font-extrabold mt-1">{{ CURRENCY }}{{ "%.2f"|format(product.price) }}</p>
      <div class="mt-4 flex space-x-2">
        <a href="/product/{{ product.id }}" class="flex-1 text-center border border-slate-300 py-1.5 rounded-md text-sm font-medium hover:bg-slate-50">Details</a>
        <form action="/cart/add" method="POST" class="flex-1">
          <input type="hidden" name="product_id" value="{{ product.id }}">
          <input type="hidden" name="quantity" value="1">
          <button type="submit" class="w-full bg-indigo-600 text-white py-1.5 rounded-md text-sm font-semibold hover:bg-indigo-700">Add to cart</button>
        </form>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
