{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-xl border border-slate-200 p-8 shadow-sm space-y-6">
  <h1 class="text-2xl font-bold">Checkout</h1>

  <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-4">
    <p class="text-xs font-semibold text-indigo-500 uppercase tracking-wide">Customer Account</p>
    <p class="text-lg font-bold text-slate-800">{{ customer_name }}</p>
  </div>

  <div class="space-y-3">
    <h3 class="font-bold text-sm text-slate-500 uppercase tracking-wide">Order Summary</h3>
    <div class="divide-y divide-slate-100">
      {% for item in items %}
      <div class="py-2 flex justify-between text-sm">
        <span>{{ item.name }} &times; {{ item.qty }}</span>
        <span class="font-medium">{{ CURRENCY }}{{ "%.2f"|format(item.price * item.qty) }}</span>
      </div>
      {% endfor %}
    </div>
    <div class="pt-3 border-t border-slate-200 flex justify-between items-center text-lg font-bold">
      <span>Grand Total:</span>
      <span class="text-2xl font-extrabold text-indigo-600">{{ CURRENCY }}{{ total_str }}</span>
    </div>
  </div>

  <form action="/checkout" method="POST">
    <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold text-base hover:bg-indigo-700 shadow">
      Order Now
    </button>
  </form>
</div>
{% endblock %}
