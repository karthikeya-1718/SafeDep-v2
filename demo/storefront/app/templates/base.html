<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ STORE_NAME }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">
  <header class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="text-2xl font-bold tracking-tight flex items-center space-x-2">
        <span>🏪</span>
        <span>{{ STORE_NAME }}</span>
      </a>
      <nav class="flex items-center space-x-6 text-sm font-medium">
        <a href="/" class="hover:text-indigo-200">Home</a>
        <a href="/products" class="hover:text-indigo-200">Products</a>
        <a href="/cart" class="hover:text-indigo-200">Cart</a>
        <a href="/orders" class="hover:text-indigo-200">Orders</a>
        <a href="/profile" class="hover:text-indigo-200">Profile</a>
      </nav>
    </div>
  </header>

  <main class="flex-grow max-w-6xl mx-auto px-4 py-8 w-full">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-slate-800 text-slate-400 text-xs py-6 border-t border-slate-700">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        &copy; 2026 {{ STORE_NAME }}. {{ TAX_NOTE }}.
      </div>
      <div class="bg-slate-700 px-3 py-1 rounded text-slate-300">
        System Status: Catalog OK ({{ INVENTORY_COUNT }} inventory table entries detected)
      </div>
    </div>
  </footer>
</body>
</html>
